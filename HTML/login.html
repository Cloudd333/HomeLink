<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HomeLink</title>
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <div class="auth-page">

        <!-- Background -->
        <div class="auth-bg"></div>
        <div class="auth-overlay"></div>

        <!-- Card -->
        <div class="auth-card">

            <div class="auth-logo">
                <img src="../images/HomeLinkLogo.jpg" alt="HomeLink">
            </div>

            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your HomeLink account</p>

            <form class="auth-form" onsubmit="handleLogin(event)">

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="input" placeholder="Enter your email" id="loginEmail" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="input" placeholder="Enter your password" id="loginPassword" required>
                </div>

                <div class="auth-row">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="auth-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-md);">
                    Log In
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account? <a href="SignUp.html" class="auth-link">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="../JS/login.js"></script>

</body>

</html>
