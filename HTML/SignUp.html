<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | HomeLink</title>
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-bg"></div>
        <div class="auth-overlay"></div>

        <div class="auth-card">

            <div class="auth-logo">
                <img src="../images/HomeLinkLogo.jpg" alt="HomeLink">
            </div>

            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join thousands finding their dream home</p>

            <form class="auth-form" onsubmit="handleSignUp(event)">

                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="input" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="input" placeholder="Enter your last name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="input" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="input" placeholder="Confirm your password" required>
                </div>

                <div class="auth-row">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-md);">
                    Let's Go!
                </button>

            </form>

            <p class="auth-footer">
                Already have an account? <a href="Login.html" class="auth-link">Log In</a>
            </p>

        </div>

    </div>

    <script src="../JS/signup.js"></script>

</body>

</html>
